services:
  - type: web
    name: RadioClaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: RadioClaw_STATE_DIR
        value: /data/.RadioClaw
      - key: RadioClaw_WORKSPACE_DIR
        value: /data/workspace
      - key: RadioClaw_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: RadioClaw-data
      mountPath: /data
      sizeGB: 1
