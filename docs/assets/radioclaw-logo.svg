<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e3a52;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f4d03f;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- 深海背景 -->
  <circle cx="256" cy="256" r="256" fill="url(#oceanGradient)"/>
  
  <!-- 放射虫骨架 - 外层格子结构 -->
  <g stroke="#ecf0f1" stroke-width="2" fill="none" opacity="0.9">
    <!-- 外圈 -->
    <circle cx="256" cy="256" r="180" stroke-width="3"/>
    
    <!-- 辐射状骨架 -->
    <line x1="256" y1="76" x2="256" y2="436"/>
    <line x1="76" y1="256" x2="436" y2="256"/>
    <line x1="129" y1="129" x2="383" y2="383"/>
    <line x1="383" y1="129" x2="129" y2="383"/>
    
    <!-- 格子图案 - 经线 -->
    <ellipse cx="256" cy="256" rx="180" ry="60" stroke-width="1.5"/>
    <ellipse cx="256" cy="256" rx="180" ry="120" stroke-width="1.5"/>
    <ellipse cx="256" cy="256" rx="60" ry="180" stroke-width="1.5"/>
    <ellipse cx="256" cy="256" rx="120" ry="180" stroke-width="1.5"/>
    
    <!-- 格子图案 - 纬线 -->
    <circle cx="256" cy="256" r="140" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="100" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="60" stroke-width="2"/>
    
    <!-- 刺状突起 -->
    <line x1="256" y1="76" x2="256" y2="40" stroke-width="3"/>
    <line x1="256" y1="436" x2="256" y2="472" stroke-width="3"/>
    <line x1="76" y1="256" x2="40" y2="256" stroke-width="3"/>
    <line x1="436" y1="256" x2="472" y2="256" stroke-width="3"/>
    <line x1="129" y1="129" x2="104" y2="104" stroke-width="3"/>
    <line x1="383" y1="383" x2="408" y2="408" stroke-width="3"/>
    <line x1="383" y1="129" x2="408" y2="104" stroke-width="3"/>
    <line x1="129" y1="383" x2="104" y2="408" stroke-width="3"/>
  </g>
  
  <!-- AI 神经网络节点 -->
  <g fill="#f4d03f">
    <circle cx="256" cy="256" r="8"/>
    <circle cx="256" cy="196" r="5"/>
    <circle cx="256" cy="316" r="5"/>
    <circle cx="196" cy="256" r="5"/>
    <circle cx="316" cy="256" r="5"/>
    <circle cx="214" cy="214" r="4"/>
    <circle cx="298" cy="298" r="4"/>
    <circle cx="298" cy="214" r="4"/>
    <circle cx="214" cy="298" r="4"/>
  </g>
  
  <!-- AI 电路连接线 -->
  <g stroke="#f4d03f" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="256" y1="256" x2="256" y2="196"/>
    <line x1="256" y1="256" x2="256" y2="316"/>
    <line x1="256" y1="256" x2="196" y2="256"/>
    <line x1="256" y1="256" x2="316" y2="256"/>
    <line x1="256" y1="196" x2="214" y2="214"/>
    <line x1="256" y1="316" x2="298" y2="298"/>
    <line x1="196" y1="256" x2="214" y2="298"/>
    <line x1="316" y1="256" x2="298" y2="214"/>
  </g>
  
  <!-- 中心发光效果 -->
  <circle cx="256" cy="256" r="40" fill="url(#glowGradient)" opacity="0.5"/>
  
  <!-- RadioClaw 文字 -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ecf0f1" text-anchor="middle" letter-spacing="2">RADIOCLAW</text>
  
  <!-- 副标题 -->
  <text x="256" y="500" font-family="Arial, sans-serif" font-size="12" fill="#bdc3c7" text-anchor="middle">Radiolaria Research AI Assistant</text>
  
  <!-- 装饰性 emoji -->
  <text x="220" y="480" font-size="24">🦞</text>
  <text x="272" y="480" font-size="24">🦠</text>
</svg>
